name: Production readiness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install exactly the reviewed dependency graph
        run: pnpm install --frozen-lockfile
      - name: Display the complete direct and transitive dependency tree
        run: pnpm deps:tree
      - name: Validate lockfile package integrity and patched constraints
        run: pnpm deps:integrity
      - name: Require a clean checkout
        run: git diff --exit-code -- . ':(exclude)pnpm-lock.yaml'
      - name: Lint
        run: pnpm lint
      - name: Strict TypeScript check
        run: pnpm typecheck
      - name: Automated tests
        run: pnpm test
      - name: Validate database migrations
        run: pnpm db:validate
      - name: Scan tracked binary artifacts
        run: pnpm scan:artifacts
      - name: Scan tracked sensitive-data signatures
        run: pnpm scan:sensitive
      - name: Production build
        run: pnpm build
      - name: Ensure checks and build did not rewrite tracked sources
        run: git diff --exit-code
      - name: Production dependency vulnerability audit
        run: pnpm audit:prod
      - name: Development dependency vulnerability audit
        run: pnpm audit:dev

  lockfile-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Reproduce the reviewed dependency graph
        run: pnpm install --frozen-lockfile
      - name: Validate every registry package integrity hash
        run: pnpm deps:integrity
      - name: Verify installed registry signatures
        run: pnpm audit signatures
